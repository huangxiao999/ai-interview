spring:
  application:
    name: interview-coach
  profiles:
    default: local
  main:
    banner-mode: "off"
  jmx:
    enabled: false
  sql:
    init:
      mode: never
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never

server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
