name: ai-interview-desktop

services:
  backend:
    image: ai-interview-desktop-backend:local
    build:
      context: ./backend
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://ai-interview-dev-postgres-1:5432/${DB_NAME:-interview_coach}
      DB_USERNAME: ${DB_USERNAME:-interview_coach}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}
      PRIVATE_FILE_ROOT: /var/lib/interview-coach/private
      BAILIAN_EMBEDDING_ENABLED: "false"
    ports:
      - "127.0.0.1:${DESKTOP_BACKEND_PORT:-18081}:8080"
    volumes:
      - desktop-private-data:/var/lib/interview-coach
      - ./.env:/run/config/host.env:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      - default
      - development-database
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  frontend:
    image: ai-interview-desktop-frontend:local
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${DESKTOP_FRONTEND_PORT:-18080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  # 保留旧卷声明，不重用、迁移或删除旧 Desktop 数据。
  desktop-postgres16-data:
  desktop-private-data:

networks:
  development-database:
    external: true
    name: ai-interview-dev_default
