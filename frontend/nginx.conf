worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    # 后端容器重建后IP可能改变，使用Compose网络DNS，不在启动时永久缓存旧地址。
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    # Nginx启动也会初始化这些模块目录；统一放进可写tmpfs，保持镜像只读。
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # 保留原URI、Session/Cookie和CSRF；不重放业务请求，不缓存私有响应或写代理临时文件。
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 70s;
    proxy_send_timeout 70s;
    proxy_next_upstream off;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 10100000;
        set $backend http://backend:8080;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api {
            proxy_pass $backend;
        }

        location /actuator {
            proxy_pass $backend;
        }

        # Vue history路由刷新仍进入应用；API错误保持后端状态，不回退成index.html。
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
