name: ai-interview-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-interview_coach}
      POSTGRES_USER: ${DB_USERNAME:-interview_coach}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env file}
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    volumes:
      - postgres16-data:/var/lib/postgresql/data
      - ./infra/postgres/001-vector.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres16-data:
